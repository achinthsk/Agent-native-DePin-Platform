name: Scheduler discovery (one candidate)

# Twice-weekly one-candidate discovery from scheduler/backlog.json,
# plus on-demand workflow_dispatch with optional candidate_name.
# Opens a PR — never merges. Never touches Elmnts or execution/.

on:
  schedule:
    # Tuesday + Friday 14:00 UTC — see scheduler/DECISIONS.md
    - cron: "0 14 * * 2,5"
  workflow_dispatch:
    inputs:
      candidate_name:
        description: >
          Optional platform to investigate now (e.g. "Decen Space").
          Leave blank to take the next item from scheduler/backlog.json.
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scheduler-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run discovery cycle (one candidate)
        id: discovery
        continue-on-error: true
        env:
          CANDIDATE_NAME: ${{ inputs.candidate_name }}
        run: |
          set -euo pipefail
          if [ -n "${CANDIDATE_NAME:-}" ]; then
            echo "On-demand override: candidate_name=${CANDIDATE_NAME}"
            python3 scheduler/run_discovery.py --candidate-name "${CANDIDATE_NAME}"
          else
            echo "No candidate_name — next backlog item"
            python3 scheduler/run_discovery.py
          fi

      - name: Guard — never touch Elmnts, execution/, adapters/, storage/
        run: |
          CHANGED=$(git diff --name-only; git ls-files --others --exclude-standard)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -E '^(storage/|execution/|adapters/|scoring/|api/|schema/)'; then
            echo "FATAL: discovery touched out-of-scope paths" >&2
            exit 1
          fi
          if echo "$CHANGED" | grep -Ei 'elmnts'; then
            echo "FATAL: discovery touched Elmnts paths" >&2
            exit 1
          fi

      - name: Open PR with results (never merge)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_NAME: ${{ inputs.candidate_name }}
        run: |
          set -euo pipefail
          BRANCH="scheduler/discovery-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "scheduler-bot"
          git config user.email "scheduler-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"

          git add scheduler/status/status_log.jsonl scheduler/backlog.json \
            candidates/ || true

          if git diff --cached --quiet; then
            echo "No file changes to commit."
            exit 1
          fi

          if [ "${{ steps.discovery.outcome }}" = "success" ]; then
            if [ -n "${CANDIDATE_NAME:-}" ]; then
              TITLE="scheduler: on-demand discovery — ${CANDIDATE_NAME} ($(date -u +%Y-%m-%d))"
              BODY="On-demand discovery via \`workflow_dispatch\` input \`candidate_name=${CANDIDATE_NAME}\`.

          Status: **success**

          - Same investigation rigor as a scheduled run.
          - Elmnts was not touched.
          - \`execution/\` was not invoked.
          - **Do not auto-merge** — human review required."
            else
              TITLE="scheduler: discovery cycle $(date -u +%Y-%m-%d)"
              BODY="Automated one-candidate discovery from \`scheduler/backlog.json\`.

          Status: **success**

          - One candidate only (backlog pointer advanced when applicable).
          - Elmnts was not touched.
          - \`execution/\` was not invoked.
          - **Do not auto-merge** — human review required."
            fi
          else
            TITLE="scheduler: discovery FAILED $(date -u +%Y-%m-%d)"
            BODY="Automated discovery **failed** (see status log).

          - Elmnts was not touched.
          - \`execution/\` was not invoked.
          - **Do not auto-merge**."
          fi

          git commit -m "$TITLE"
          git push -u origin "$BRANCH"
          gh pr create --title "$TITLE" --body "$BODY" --base main || true

          if [ "${{ steps.discovery.outcome }}" != "success" ]; then
            exit 1
          fi
